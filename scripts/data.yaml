# ============================================================
# RDD2022 数据集配置
# ============================================================
# ⚠️ 你【不用】手动改这个文件里的任何路径
#
#    跑一次下载脚本，path 会被自动填好：
#        uv run python scripts/download_data.py
#
#    跑完后 path 会自动变成类似：
#        path: D:/.../graduation-project/datasets/rdd2022
#
#    唯一需要手动改的情况：你已经自己解压了数据集，
#    且不想跑下载脚本 —— 那就把下面的 path 改成你的实际路径
# ============================================================

# 数据集根目录
# ↓ 下面这行是【占位符】，跑 download_data.py 后会被自动替换
path: D:/File_kk/WorkSpace/graduation-project/datasets/sreekaraditya/rdd2022-yolo-crackscan-v2/versions/2

# 划分文件（相对 path 的路径，通常不用动）
train: train/images
val: val/images
test: test/images

# ---- 类别定义 ----
# RDD2022 官方 4 类，与 Kaggle YOLO 版一致
nc: 4
names:
  0: Longitudinal      # D00 纵向裂缝
  1: Transverse        # D10 横向裂缝
  2: Alligator         # D20 龟裂（网状裂缝）
  3: Pothole           # D40 坑洞

# ---- 训练提示（写在注释里，方便查阅）----
# ⚠️ 本数据集必须设置 fliplr=0.0
#    原因：水平翻转会把「纵向裂缝」变成「横向裂缝」，造成标签语义错误
#    命令：yolo train ... fliplr=0.0
#
# ⚠️ 旋转角度不宜过大（degrees<=5），裂缝方向本身是有语义的
#
# 4GB 显存建议：batch=8, amp=True
# 8GB+ 显存建议：batch=16, amp=True
